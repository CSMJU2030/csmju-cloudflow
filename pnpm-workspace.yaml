packages:
  - 'frontend'
  - 'backend'

# pnpm 12 ไม่รัน build script ของแพ็กเกจที่ไม่ได้อนุญาต — ต้องประกาศไว้ที่นี่
allowBuilds:
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  '@nestjs/core': true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': false
  '@scarf/scarf': false
